[project]
name = "openalpha-workspace"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["openalpha-bridge", "openalpha-research-core", "openalpha-sentinel"]

[dependency-groups]
dev = ["fastapi>=0.115,<1", "httpx>=0.27", "hypothesis>=6.0", "jsonschema>=4.23,<5", "openalpha-experiment-spec", "pyright>=1.1", "pytest>=8.0", "pytest-asyncio>=0.25", "ruff>=0.12"]
sentinel-phase2 = ["yfinance==1.5.2"]

sentinel-phase3 = ['scikit-learn==1.7.2']

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
openalpha-bridge = { workspace = true }
openalpha-experiment-spec = { workspace = true }
openalpha-research-core = { workspace = true }
openalpha-sentinel = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ['.']
testpaths = ["tests", "packages"]
markers = ["slow: resource-intensive integration", "network: external network required", "kronos: official checkpoint inference"]

[tool.ruff]
line-length = 100
target-version = "py313"
# Verbatim third-party source, kept byte-exact so its digests still match what
# experiment.yaml seals. Formatting or fixing it would change the bytes and
# break the conformance verification it exists for.
extend-exclude = ["vendor"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom requires these calls in argument
# defaults; they are evaluated once at decoration time, not per request.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
]

[tool.pyright]
# scripts/kronos_constrained_worker.py reads Windows-only ctypes.windll behind a
# platform.system() guard, so the branch is unreachable on Linux. It is also
# hash-sealed by research/sentinel-v1/feasibility/manifest.json and therefore
# cannot be edited to add a suppression without invalidating preserved research
# evidence. Ignoring the single sealed file keeps CI platform-independent.
# vendor/ holds verbatim copies of third-party source, kept byte-exact so their
# digests still match what experiment.yaml seals. They are never imported and
# never shipped; editing them to satisfy a type checker would break the very
# thing they exist to prove.
ignore = ["scripts/kronos_constrained_worker.py", "vendor"]
# Specifying `exclude` replaces pyright's defaults rather than adding to them,
# so the default patterns are repeated here. Dropping `**/.*` makes pyright
# walk .venv and effectively hang.
exclude = ["vendor", "**/node_modules", "**/__pycache__", "**/.*"]
