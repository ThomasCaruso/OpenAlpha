name: Research Integrity

on:
  pull_request:
  push:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs, not tags. A tag can be moved; a
      # commit cannot. This workflow is what asserts the research record is
      # intact, so its own toolchain is pinned the same way every study is.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync locked verification dependencies
        run: uv sync --locked --group dev --group sentinel-phase3

      - name: Assert Torch is absent
        run: uv run python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"

      - name: Run the offline test suite
        run: uv run pytest -q -m "not network and not kronos"

      - name: Verify sealed specifications
        run: uv run python scripts/verify_specifications.py

      - name: Verify published artifacts
        run: uv run python scripts/verify_artifacts.py

      - name: Lint active Python surfaces
        run: uv run ruff check packages cloud tests scripts

      - name: Type-check workspace
        run: uv run pyright
