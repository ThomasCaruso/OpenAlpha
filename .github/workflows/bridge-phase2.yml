name: Bridge Phase 2

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_training_tests:
        description: "Install Torch and run the real 17,605-parameter head tests"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Base CI: no Torch, no Kronos assets, no provider access. Every contributor
  # can run this without multi-gigabyte GPU dependencies.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.13

      - name: Sync base dependencies only
        # sentinel-phase3 supplies scikit-learn (and transitively scipy), which
        # the pre-existing Sentinel tests import. Neither pulls Torch, so the
        # no-Torch guarantee below still holds.
        run: uv sync --locked --group dev --group sentinel-phase3

      - name: Assert Torch is absent from the base environment
        run: |
          if uv run python -c "import torch" 2>/dev/null; then
            echo "Torch must not be present in the base environment"
            exit 1
          fi
          echo "torch absent, as required"

      - name: Assert importing the bridge pulls in no heavy dependency
        run: |
          uv run python -c "
          import sys
          import openalpha_bridge, openalpha_bridge.phase2
          assert 'torch' not in sys.modules, 'importing the bridge pulled in torch'
          assert 'huggingface_hub' not in sys.modules, 'importing the bridge pulled in huggingface_hub'
          assert 'yfinance' not in sys.modules, 'importing the bridge pulled in yfinance'
          print('optional dependency boundary intact')
          "

      - name: Full base test suite
        run: uv run pytest -q

      - name: Windowing, state machine, cache, metric, bootstrap, and gate tests
        run: |
          uv run pytest \
            packages/bridge/tests/test_windowing.py \
            packages/bridge/tests/test_phase2_pipeline.py \
            -q

      - name: Synthetic end-to-end pipeline validation
        run: |
          uv run pytest \
            packages/bridge/tests/test_phase2_pipeline.py \
            -k synthetic -q

      - name: GPU preflight must fail closed on a CPU runner
        run: |
          set +e
          uv run python -m openalpha_bridge.phase2 preflight \
            --experiment research/bridge-v0 \
            --run-dir "${RUNNER_TEMP}/run" \
            --cache-dir "${RUNNER_TEMP}/cache" \
            --repository-root "${GITHUB_WORKSPACE}" \
            --json
          status=$?
          set -e
          if [ "${status}" -eq 0 ]; then
            echo "preflight must not pass without an accelerator"
            exit 1
          fi
          echo "preflight blocked as expected (exit ${status})"

      - name: Verify locked experiment hashes
        run: |
          uv run python -c "
          from pathlib import Path
          from openalpha_bridge.phase2.identity import verify_locked_hashes
          print(verify_locked_hashes(Path('research/bridge-v0')))
          "

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright

  # Optional: only on manual dispatch. Installs Torch and exercises the real
  # head. Never required for a pull request.
  training:
    if: github.event_name == 'workflow_dispatch' && inputs.run_training_tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv python install 3.13

      - name: Sync with the training extra
        run: uv sync --locked --extra bridge-training --group dev

      - name: Real 17,605-parameter head, gradients, and checkpoint round trip
        run: uv run pytest -q -m "not network and not kronos" packages/bridge/tests
        env:
          OPENALPHA_TRAINING_EXTRA: "1"
