experiment_id: openalpha-kronos-base-replication-v1
schema_version: openalpha.research.kronos_base_replication.v1
title: >-
  Does the Kronos-mini structural-invalidity result persist with Kronos-base,
  and does restoring structural validity improve predictive performance?
status: preregistered
preregistered_before_execution: true

