# Held identical to the mini study wherever the base model does not make a
# change mathematically mandatory, so that any difference in result is
# attributable to the model family.
window:
  symbol: SPY
  frequency: 1d
  calendar: XNYS
  retrieval_start_inclusive: '2015-05-07'
  retrieval_end_exclusive: '2017-05-18'
  total_candles: 512
  context_candles: 448
  target_candles: 64
  provider_retrievals_permitted: 1

context_budget_proof:
  maximum_context: 512
  context_candles: 448
  generated_candles: 64
  sum: 512
  truncation_occurs: false
  argument: >-
    The official predictor selects the final max_context tokens of the
    concatenated context and generated sequence before decoding. With 448
    context rows and 64 generated rows the concatenated length is exactly 512,
    which equals max_context, so the selection is the identity and no context
    row is dropped. The final generated step is produced from a window of
    length 511 plus itself, still within budget. This is asserted structurally
    in code rather than assumed.

normalization:
  fitted_on: context_rows_only
  fitted_candle_count: 448
  dtype: float32
  mean: numpy.mean(axis=0)
  standard_deviation: numpy.std(axis=0)
  standard_deviation_ddof: 0
  epsilon: 1.0e-05
  formula: (x - mean) / (std + epsilon)
  clip_policy: symmetric_clip_after_standardization
  clip_value: 5.0
  inverse: x * (std + epsilon) + mean

inference_settings:
  temperature: 1.0
  top_k: 0
  top_p: 0.9
  sample_count_per_call: 1
  prediction_length: 64
  max_context: 512
  clip: 5.0
  context_length_used: 448
  verbose: false
  parameters_frozen: true
  gradient_mode: inference_mode
  note: >-
    Identical to the mini study. These are KronosPredictor.predict defaults in
    the pinned source and are properties of the call, not of the checkpoint.

methods:
  - id: A
    name: A_TOKENIZER_ROUND_TRIP
    description: >-
      Encode and decode all 512 normalized rows with the base tokenizer and
      measure structural validity and reconstruction error of the result.
  - id: B
    name: B_OFFICIAL_FROZEN_FORECAST
    description: >-
      One official frozen autoregressive forecast of 64 steps from the 448
      context rows, seed 20150507, recording coarse and fine token ids and
      sampling log probabilities.
  - id: C
    name: C_DETERMINISTIC_TERMINAL_PROJECTION
    description: >-
      Deterministically repair every structural violation in the Method B path
      and re-measure both validity and forecast error.
  - id: D
    name: D_VALID_ROLLOUT_FILTERING
    description: >-
      64 seeded rollouts, filtering to structurally valid paths, compared
      against size-matched control ensembles drawn without replacement.

rollouts:
  count: 64
  seed_base: 20150507
  seeds: consecutive integers from the seed base, seed_base + index
  control_seed: 20170518
  control_repetitions: 200
  control_sampling: without_replacement_within_each_repetition

metrics:
  primary_metric: close_return_mae
  persistence_baseline: zero_return
  skill_definition: 1 - candidate_error / persistence_error
  directional_accuracy: >-
    Agreement of predicted and actual return sign, with zero-return steps
    counted explicitly rather than silently assigned a direction.
  sampling_probability_definition: >-
    log_softmax_of_temperature_scaled_then_top_k_top_p_filtered_logits_renormalized

structural_validity_rules:
  - high >= open
  - high >= close
  - high >= low
  - low <= open
  - low <= close
  - volume >= 0
  - amount >= 0

# Identical to the mini study. Fixed before execution and not revisable after
# a result is observed.
thresholds:
  roundtrip_material_invalid_fraction: 0.01
  minimum_relative_improvement: 0.05
  valid_rollout_support_fraction_minimum: 0.25
  material_clipping_row_fraction: 0.01
  minimum_persistence_skill: 0.0

decision_rules:
  note: >-
    The same multi-finding rule set as mini v4, applied to base measurements.
    Every rule is evaluated and recorded; one primary conclusion is selected;
    matched findings are reported in full. The rule identifiers and their
    order are unchanged so the two studies can be compared rule by rule.
  rule_ids:
    - R0
    - R0b
    - R1
    - R2
    - R2a
    - R2b
    - R2c
    - R2d
    - R3
    - R4
    - R5
    - R6
    - R7
    - R8
    - R9
    - R10

artifacts:
  namespace: openalpha-compatibility/kronos-base-diagnostic/runs/<run_id>
  object_name: kronos_base_diagnostic_terminal.json
  run_id_pattern: ^base_[0-9a-f]{8,32}$
  success_schema: openalpha.bridge.base_study.kronos_base_diagnostic.v1
  failure_schema: openalpha.bridge.base_study.kronos_base_failure.v1
  runtime_probe_schema: openalpha.bridge.base_study.runtime_probe.v1
  immutability: >-
    Exactly one terminal artifact per run identifier, written immutably. A run
    identifier is spent on first use regardless of outcome and is never
    retried or reused. Terminal evidence is written to immutable object
    storage, never only to a cache volume.
  namespace_separation: >-
    The base namespace shares no prefix with the mini namespace
    (openalpha-compatibility/bridge-phase2/runs/<run_id>/
    frozen-inference-diagnostic/), and the base run-identifier pattern shares
    no accepted string with the mini canary_ pattern, so an artifact of one
    study can never be written or read under the identity of the other.

prohibitions:
  - no training
  - no optimizer construction
  - no checkpointing
  - no held-out partition opening
  - no production inference
  - no trading claims
  - no retries
  - no run-identifier reuse
  - no local download of official weights
  - no substitution of the mini tokenizer or the mini model
  - no modification of any mini specification, artifact, run identifier or hash

claim_boundary: DEVELOPMENT DIAGNOSTIC - NOT HOLDOUT OR TRADING EVIDENCE

authorizations:
  authorizes_training: false
  authorizes_stage_b: false
  authorizes_stage_c: false
  authorizes_test_opening: false
  authorizes_production_inference: false
  authorizes_trading_claims: false
  scientific_result_available: false
