  # This is a separate study with its own identity, not an amendment to the
  # completed Kronos-mini work. The mini specifications, artifacts, run
  # identifiers and hashes are immutable and are referenced here only so the
  # two can be compared honestly.
  prior_study: bridge-v0 frozen inference diagnostic (Kronos-mini)
  prior_operative_specification: phase2-frozen-inference-diagnostic-v4.yaml
  prior_operative_specification_sha256: bd407722adfc3ebf92eb187828d42c2c9cfa57b2fdc0406121f27d39a5c44977
  prior_specification_chain:
    - name: phase2-frozen-inference-diagnostic.yaml
      sha256: c909e156a61ac5b5323de9e794aad20521839c0f43f491fb356c1968f730101b
    - name: phase2-frozen-inference-diagnostic-v2.yaml
      sha256: c39fff4541afcc948cd80fcc545398312897efe723deca26554143989e4a175e
    - name: phase2-frozen-inference-diagnostic-v3.yaml
      sha256: f10076b6676a72552b1c9c96720d0087c009fc939e4667509bfcfccf7929bcb6
    - name: phase2-frozen-inference-diagnostic-v4.yaml
      sha256: bd407722adfc3ebf92eb187828d42c2c9cfa57b2fdc0406121f27d39a5c44977
  prior_completed_run_id: canary_0a92fde788bd685c
  prior_completed_artifact_sha256: 8e3d8a333c11c1939c5d182db73012fc3e0fc01da42368eb23f71661aadab18c
  prior_primary_conclusion: ROUNDTRIP_MATERIAL_INVALIDITY
  prior_recommended_next_experiment: ABANDON_STRUCTURAL_VALIDITY_DIRECTION
  prior_spent_failed_run_id: canary_a91fcd689de78428
  interchangeability: >-
    A Kronos-base result and a Kronos-mini result are never interchangeable.
    They use different model weights, a different tokenizer, different
    architectures and different artifact schemas. Neither may be substituted
    for the other, quoted as the other, or pooled with the other. A comparison
    between them is a comparison between two studies, not two runs of one.

question: >-
  Does the structural invalidity observed when Kronos-mini and
  Kronos-Tokenizer-2k reconstruct and forecast SPY daily candles persist when
  the stronger publicly released Kronos-base model is used with its officially
  paired Kronos-Tokenizer-base, and does restoring structural validity by
  deterministic terminal projection improve predictive performance?

# Declared before any base weight is loaded. No threshold, seed or rule below
# may be changed after a result is observed.
predeclared_interpretations:
  - id: I1
    label: INVALIDITY_PERSISTS_AND_REPAIR_GIVES_NO_SKILL
    statement: >-
      Kronos-base reproduces material structural invalidity and deterministic
      terminal projection still yields no improvement in the primary metric.
      This would replicate the mini finding at a larger model scale and would
      support treating structural invalidity as a property of the token
      representation rather than of model capacity.
  - id: I2
    label: INVALIDITY_MATERIALLY_REDUCED_BUT_NO_SKILL
    statement: >-
      Kronos-base materially reduces the invalid-candle fraction relative to
      the mini study, but forecasting still fails to beat the zero-return
      persistence baseline. This would separate representation quality from
      predictive skill.
  - id: I3
    label: INVALIDITY_REDUCED_AND_SKILL_OR_RELATIONSHIP_OBSERVED
    statement: >-
      Kronos-base materially reduces invalidity and either demonstrates skill
      against persistence or demonstrates a relationship between structural
      validity and forecast error. This would be the only outcome that
      supports continuing the constraint-preserving decoder direction.

