held_out_target_candle_interpretation:
  phrase_source: research/bridge-v0/preregistration.md
  phrase: >-
    Evaluation requires at least 5,000 unique held-out target candles and at
    least 500 unique unseen-symbol target candles.
  declared_interpretation: >-
    The 5,000 minimum counts the whole reconstruction-test scored corpus, which
    comprises both the 14 training symbols and the 6 unseen symbols. The 500
    minimum is a composition floor on the unseen-symbol subset of that same
    corpus.
  rationale: >-
    minimum_unique_unseen_symbol_test_candles is declared inside the Phase 2
    windowing block of the original lock, which places unseen symbols inside the
    Phase 2 reconstruction-test pass rather than only inside Phase 4.
  declared_before_any_data_access: true
  threshold_value_changed: false
  interpretation_declared_after_seeing_outcomes: false

