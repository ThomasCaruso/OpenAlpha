    - losses
    - model_fitting
    - preprocessing_fitting
    - checkpoint_selection
    - threshold_selection
    - final_metrics
  partition_isolation_does_not_prohibit:
    - earlier_chronological_observations_as_read_only_causal_context
  train_examples:
    all_64_scored_candles_inside_train: required
    context_precedes_scored_suffix_chronologically: required
    context_may_come_from_earlier_training_history: true
    validation_or_test_candle_anywhere_in_example: prohibited
  validation_examples:
    all_64_scored_candles_inside_validation: required
    prefix_may_include_earlier_training_history: true
    candle_at_or_after_scored_suffix_start_in_context_or_normalization: prohibited
    influence_on_optimizer_updates: prohibited
    permitted_use: locked_checkpoint_selection_and_early_stopping_only
  test_examples:
    all_64_scored_candles_inside_test: required
    prefix_may_include_earlier_training_and_validation_history: true
    influence_on_training: prohibited
    influence_on_preprocessing_fitting: prohibited
    influence_on_checkpoint_selection: prohibited
    influence_on_threshold_or_configuration: prohibited
    evaluation_count: exactly_once_after_checkpoint_selection_frozen
  external_and_unseen_symbol_slices:
    all_scored_targets_inside_declared_slice: required
    historical_warm_up_context_may_precede_slice: true
    unseen_symbol_remains_unseen_during_training: true
    unseen_symbol_data_fitting_bridge_parameters: prohibited
    unseen_symbol_data_fitting_bridge_preprocessing: prohibited
  forbidden_flows:
    - validation_target_into_training_loss
    - test_target_into_validation_selection
    - future_target_candle_into_earlier_causal_hidden_state

