  superseded_block: literal_split_contract
  superseded_reason: >-
    The literal_split_contract recorded a protocol-design error, not an
    observation. It required a complete 512-candle example to lie wholly inside
    one chronological partition and set
    context_prefix_borrowing_from_another_partition to false. The original lock
    never stated that; it declares causal_prefix_length 448 and
    supervised_suffix_length 64 separately, and split_crossing referred to the
    scored target, not the read-only warm-up context.

