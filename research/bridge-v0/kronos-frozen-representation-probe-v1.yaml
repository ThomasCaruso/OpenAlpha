experiment_id: openalpha-kronos-frozen-representation-probe-v1
schema_version: openalpha.research.representation_probe.kronos_frozen.v1
title: >-
  Do frozen Kronos-base hidden states carry information about future returns that
  raw and engineered features do not?
status: development_only_probe_specification
preregistered_before_execution: true
# Stated as a verifiable timestamp relation, not as a claim about data
# existence. Every test session begins strictly after the sealing instant.
all_test_sessions_begin_after_sealing: true

# The sealing instant. Every test observation is required to occur strictly
# after it, and the test boundary below is derived from it rather than chosen.
sealing:
  preregistration_commit: 7e9395c6536a890b248f1effc62c5d1994105bfb
  sealed_at_utc: '2026-08-04T03:12:08+00:00'
  sealed_at_exchange_time: '2026-08-03T23:12:08-04:00'
  exchange_timezone: America/New_York
  exchange_date_at_sealing: '2026-08-03'
  session_state_at_sealing: >-
    The 2026-08-03 session had already opened and closed. The first XNYS session
    that had not begun at the sealing instant is 2026-08-04, whose 09:30 ET open
    is strictly after it.
  correction_note: >-
    The first sealed revision of this document set the test boundary at
    2026-05-13 and claimed the test observations did not exist at sealing. That
    claim was false: this document was sealed in August 2026, so sessions from
    2026-05-13 through 2026-08-03 already existed and were in principle
    observable. The boundary has been moved to the first session that had not
    begun when the preregistration was sealed, and the justification is now
    stated in terms of that timestamp rather than in terms of the data not
    existing. No code had been written, no feature extracted, no model fitted and
    no test data retrieved or inspected at any point before or after the original
    sealing.
  superseded_digest: a3f7b8fe40f41a2315f533d5cf0d393f238d7f57082481a0aa57a712633db6a2

# ---------------------------------------------------------------------------
# Relationship to prior work
# ---------------------------------------------------------------------------

relationship_to_prior_work:
  completed_studies:
    - study: bridge-v0 frozen inference diagnostic (Kronos-mini)
      run_id: canary_0a92fde788bd685c
      primary_conclusion: ROUNDTRIP_MATERIAL_INVALIDITY
    - study: openalpha-kronos-base-replication-v1
      run_id: base_03b08cbc706193d6
      artifact_sha256: 84ec1b197d4bf7a3b8f35a38d0feb8d5be086b61de23df0924d83ec273c731e6
      primary_conclusion: ROUNDTRIP_MATERIAL_INVALIDITY
    - study: openalpha-kronos-zero-shot-benchmark-v1
      run_id: zsb_25e0256eefb2b07a
      artifact_sha256: 93688f04ab2d887cacc56fad717d1cd2e018635b70e4a36d4e0cf480b265236a
      primary_conclusion: NO_ZERO_SHOT_SKILL
      decision_outcome: PROCEED_TO_FROZEN_REPRESENTATION_PROBE
  authorised_by: >-
    Rule Z4 of the zero-shot benchmark mapped to
    PROCEED_TO_FROZEN_REPRESENTATION_PROBE. That outcome names this study; it
    does not authorise it. This document is that authorisation.
  is_a_structural_repair_experiment: false
  is_a_continuation_of_structural_repair: false
  amends_a_completed_study: false
  reuses_any_spent_run_id: false

# ---------------------------------------------------------------------------
# Question
# ---------------------------------------------------------------------------

question: >-
  Does the frozen Kronos-base final-layer hidden state contain information about
  future returns that is not already available from raw OHLCV or from simple
  engineered return and volatility features, when all are fed to an identical
  downstream model?

why_this_is_a_different_hypothesis: >-
  The completed studies measured what the model emits. A sequence model can
  generate poorly and still encode useful state: sampling noise, tokenizer
  lossiness and exposure bias all degrade generated paths without necessarily
  destroying the information in the layers that produced them. This study reads
  hidden states and fits a small linear model on top. It decodes no candles,
  enforces no OHLC inequality, repairs and filters nothing, and does not touch
  the generation path.

predeclared_interpretations:
  - label: R1
    statement: >-
      A favorable result means the frozen representation beat every control
      under an identical harness on an untouched test partition. It does not
      mean the model is tradable, profitable after costs, or usable in
      production.
  - label: R2
    statement: >-
      An unfavorable result means the representation carried no advantage over
      simple features at this horizon, panel and sample size. Given the
      deliberately low power declared below, it does not establish that the
      representation is uninformative in general.
  - label: R3
    statement: >-
      This study cannot reopen the structural-validity question or the zero-shot
      generation question. Both are closed. No structural quantity enters any
      decision rule.

