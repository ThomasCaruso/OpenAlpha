    per_rollout_preserved:
      - generated_token_sequence
      - token_log_probability
      - raw_decoded_output
      - validity_status
      - forecast_metrics
    aggregation:
      when_at_least_one_valid_path_exists:
        average_only_valid_paths: required
        averaging_invalid_paths_into_the_final_result: prohibited
      when_no_valid_path_exists:
        emit_typed_result: NO_VALID_ROLLOUTS
        silent_projection_or_substitution: prohibited
    records:
      - valid_rollout_count
      - valid_rollout_fraction
      - accuracy_of_valid_group
      - accuracy_of_invalid_group
      - valid_only_ensemble_output
      - official_all_rollout_ensemble_output
      - diversity_metrics
      - repeated_path_metrics
      - compute_and_latency_measurements

structural_validity_definition:
  candle_is_valid_when_all_hold:
    - every_price_is_finite
    - every_price_is_strictly_positive
    - high_greater_than_or_equal_to_open
    - high_greater_than_or_equal_to_close
    - high_greater_than_or_equal_to_low
    - low_less_than_or_equal_to_open
    - low_less_than_or_equal_to_close
    - volume_is_finite_and_nonnegative
  path_is_valid_when: every_candle_in_the_path_is_valid

forecast_metrics:
  primary_metric: close_return_mae
  primary_metric_definition: >
    Mean absolute error of one-step log close-to-close returns over the 64
    scored steps, with the first step measured against the final observed
    context close. Scale free, so it is comparable across methods.
  secondary_metrics:
    - close_mae
    - full_ohlc_mae
  lower_is_better: true

conclusion_rules:
  binding: >
    The conclusion is computed by evaluating these rules in order and taking the
    first that matches. It is never selected by inspection after the numbers are
    known. Every threshold below is fixed by this document.
  thresholds:
    roundtrip_invalid_fraction_maximum: 0.01
    minimum_relative_improvement: 0.05
    valid_rollout_support_fraction_minimum: 0.25
    accuracy_equivalence_margin: 0.05
  ordered_rules:
    - id: R0
      condition: any_method_raised_an_operational_failure
      conclusion: DIAGNOSTIC_OPERATIONAL_FAILURE
    - id: R1
      condition: method_a_invalid_candle_fraction > roundtrip_invalid_fraction_maximum
      conclusion: TOKENIZER_DECODER_DEFECT
      rationale: >
        The decoder produces invalid candles from in-distribution encoder
        tokens, which is upstream of generation and confounds everything below.
    - id: R2
      condition: method_d_valid_rollout_count == 0
      conclusion: NO_VALID_ROLLOUTS
    - id: R3
      condition: >
        method_d_valid_only_primary_error <= method_d_all_rollout_primary_error *
        (1 - minimum_relative_improvement)
      conclusion: VALIDITY_FILTER_IMPROVES_FORECAST
    - id: R4
      condition: method_d_valid_rollout_fraction < valid_rollout_support_fraction_minimum
      conclusion: GENERATED_TOKEN_SUPPORT_DEFECT
      rationale: >
        Round trip is clean but most generated token combinations decode
        outside the valid region, so invalidity enters through generation.
    - id: R5
      condition: >
        method_b_path_is_invalid and method_c_projection_restores_validity and
        method_c_primary_error > method_b_primary_error *
        (1 - minimum_relative_improvement)
      conclusion: VALIDITY_REPAIR_ONLY
      rationale: >
        Geometry is repairable and repair does restore validity, but it buys no
        accuracy.
    - id: R6
      condition: otherwise
      conclusion: INVALIDITY_NOT_CAUSAL_TO_FORECAST_ERROR
      rationale: >
        Forecasts are structurally acceptable, or their validity is unrelated to
        their error, so invalidity is not what is driving forecast quality.

artifact:
  count: 1
  immutable: true
  evidence_class: development_compatibility_canary
  authorizes_training: false
  authorizes_stage_b: false
  authorizes_stage_c: false
  authorizes_test_opening: false
  authorizes_production_inference: false
  authorizes_trading_claims: false
  scientific_result_available: false

contingent_next_experiment:
  name: constraint_aware_coarse_fine_token_beam_search
  status: not_implemented_and_not_authorized
  implement_only_if_either:
    - VALIDITY_FILTER_IMPROVES_FORECAST
    - NO_VALID_ROLLOUTS
  reason: >
    Beam search is only worth its complexity if validity filtering is shown to
    help, or if too few valid paths exist for rejection sampling to be usable.
    Building it before the diagnostic answers that would be speculative.

stop_condition: >
  Execution stops after the diagnostic artifact is written. No stage advances,
  no partition is opened, and no further computation is authorized by any
  outcome.
