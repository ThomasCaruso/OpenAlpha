    revision: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
    files:
      model/kronos.py:
        sha256_crlf_normalized: 638a56e035856c600c9848b368be087cb706a61603a0790124968c95b8c69f3a
        sha256_as_committed: 0a5f90282e2039c2de0771473419715c845def154896dbd0f5747837e6241032
      model/module.py:
        sha256_crlf_normalized: a07edbadc0e96804c8158c021bbc6063bb7cc43b34d7fc470d5c8ff2005a409f
        sha256_as_committed: a07edbadc0e96804c8158c021bbc6063bb7cc43b34d7fc470d5c8ff2005a409f
  forecast_model:
    repository: NeoQuasar/Kronos-base
    revision: 2b554741eca47781b64468546e77fef3e85130e6
