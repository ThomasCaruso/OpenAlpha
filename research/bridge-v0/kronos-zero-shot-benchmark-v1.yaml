experiment_id: openalpha-kronos-zero-shot-benchmark-v1
schema_version: openalpha.research.zero_shot.kronos_benchmark.v1
title: >-
  Zero-shot forecast skill of frozen Kronos-base against simple baselines under
  paper-style daily horizons across multiple chronological development origins
status: development_only_benchmark_specification
preregistered_before_execution: true

# ---------------------------------------------------------------------------
# Relationship to prior work
# ---------------------------------------------------------------------------
#
# This is a NEW study. It is not an amendment, retry, reopening, reinterpretation
# or optimization of either completed structural-validity diagnostic. It asks a
# different question, under a different configuration, with a disjoint identity
# in every namespace.

relationship_to_prior_work:
  completed_studies:
    - study: bridge-v0 frozen inference diagnostic (Kronos-mini)
      run_id: canary_0a92fde788bd685c
      artifact_sha256: 8e3d8a333c11c1939c5d182db73012fc3e0fc01da42368eb23f71661aadab18c
      operative_specification: phase2-frozen-inference-diagnostic-v4.yaml
      operative_specification_sha256: bd407722adfc3ebf92eb187828d42c2c9cfa57b2fdc0406121f27d39a5c44977
      primary_conclusion: ROUNDTRIP_MATERIAL_INVALIDITY
    - study: openalpha-kronos-base-replication-v1
      run_id: base_03b08cbc706193d6
      artifact_sha256: 84ec1b197d4bf7a3b8f35a38d0feb8d5be086b61de23df0924d83ec273c731e6
      operative_specification: kronos-base-replication-v1.yaml
      operative_specification_sha256: 47ad7956adce368d5c6c69e54aea939ab6497bb4d411c96f894a4e30b7be58dd
      primary_conclusion: ROUNDTRIP_MATERIAL_INVALIDITY
  structural_validity_hypothesis: closed
  is_a_structural_repair_experiment: false
  amends_a_completed_study: false
  interchangeability: >-
    Results of this benchmark are not interchangeable with either completed
    diagnostic. The completed studies measured structural validity at one long
    horizon on one asset. This benchmark measures forecast skill at a short
    horizon across four assets and twenty-five origins each. Neither can be
    substituted for the other.

# ---------------------------------------------------------------------------
# Question
# ---------------------------------------------------------------------------

question: >-
  Can frozen Kronos-base zero-shot forecasts beat simple persistence under
  shorter, paper-style forecasting horizons across multiple chronological
  development origins?

subject: external validity and forecast configuration
not_subject: structural repair, constrained decoding, validity filtering

predeclared_interpretations:
  - label: I1
    statement: >-
      A favorable result means the frozen model beat zero-return persistence on
      the preregistered primary metric under a preregistered configuration at
      development origins. It does not mean the model is tradable, profitable
      after costs, or validated on held-out data.
  - label: I2
    statement: >-
      An unfavorable result means direct zero-shot generation did not beat
      persistence under the two tested configurations at the tested horizon and
      origins. It does not establish that Kronos internal representations are
      uninformative; that is a separate hypothesis with its own future study.
  - label: I3
    statement: >-
      This benchmark cannot reopen the structural-validity question. Structural
      metrics are recorded as descriptive fields only and are excluded from every
      decision rule by construction.

# ---------------------------------------------------------------------------
# Pinned assets - the already verified frozen pair
# ---------------------------------------------------------------------------

