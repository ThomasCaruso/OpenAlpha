schema_version: "sentinel-v0.4"
experiment_id: "openalpha-sentinel-v0"
status: "phase_2_5_structural_validity_amended_before_development_sample"
locked_on: "2026-07-30"
claim_scope: "development_feasibility_only"
amendment:
  amended_on: "2026-07-30"
  supersedes_sha256: "587bc36ac1dd941c66d9e94c92d7b26a33faeb8e7e7a38883762f0cb54897950"
  changed_fields:
    - "schema_version"
    - "status"
    - "amendment"
    - "diagnostics"
    - "expected_error_correlation_signs"
    - "structural_validity"
  methodological_reason: >-
    Phase 2.5 established before any risk-model fit or holdout inspection that
    the pinned official Kronos predictor can return reproducible OHLC-ordering
    violations. Structural validity is therefore locked as a candidate
    development diagnostic and runtime gate. Raw outputs remain immutable;
    projection is optional, separate, and never substituted silently.
research_question: >-
  Can information available at forecast time predict the future error of a
  financial forecasting model, and can selective use, blending, or abstention
  outperform blindly accepting every forecast?

universe:
  assets: ["SPY", "QQQ"]
  calendar: "XNYS"
  frequency: "1Day"
  horizon_sessions: 5

periods:
  development:
    start: "2024-07-01"
    end: "2025-06-30"
  holdout:
    start: "2025-07-01"
    end: "2026-06-30"
    status: "untouched_until_risk_model_freeze"

cutoffs:
  rule: "last_valid_xnys_session_of_each_iso_week"
  boundary_policy: >-
    Compute the final XNYS session of each complete ISO week first, then include
    that cutoff only when the computed session falls inside the segment; never
    create partial-week cutoffs at a segment boundary.
  chronological: true
  expected_per_segment_per_asset: 52
  target_usable_per_asset:
    minimum: 100
    maximum: 200
  exact_list_policy: >-
    Materialize and content-address the exact ordered cutoff list before the
    first diagnostic-model fit; retain exclusions and do not select replacement
    dates after failures.
  allowed_exclusions:
    - "INSUFFICIENT_CAUSAL_HISTORY"
    - "MISSING_FIVE_SESSION_OUTCOME"
    - "PROVIDER_DATA_QUALITY_FAILURE"
    - "REAL_INFERENCE_FAILURE"

market_data:
  provider: "yahoo_finance"
  client: "yfinance"
  client_version: "1.5.2"
  underlying_data_source: "Yahoo Finance"
  access_class: "unofficial_public_interface"
  intended_use: "local_research_and_education"
  redistribution: "prohibited_by_project_policy"
  credentials_required: false
  official_yahoo_integration: false
  institutional_point_in_time_source: false
  request:
    symbols: ["SPY", "QQQ"]
    interval: "1d"
    start_inclusive: "2022-06-01"
    end_exclusive: "2024-07-06"
    auto_adjust: false
    back_adjust: false
    repair: false
    actions: true
    progress: false
    threads: false
    timeout_seconds: 30.0
    prepost: false
    rounding: false
    keepna: false
    multi_level_index: false
    adjustment: "raw"
    feed: "not_applicable"
    project_retries: 0
  cutoff_policy:
    request_end_is_exclusive: true
    final_eligible_input_session: "2024-07-05"
    reject_post_cutoff_rows: true
    require_exact_final_session: true
    calendar: "XNYS"
  outcome_request:
    operation: "logically_separate_after_forecast_seal"
    symbol: "SPY"
    start_inclusive: "2024-07-06"
    end_exclusive: "2024-07-13"
    expected_sessions:
      - "2024-07-08"
      - "2024-07-09"
      - "2024-07-10"
      - "2024-07-11"
      - "2024-07-12"
    reuse_explicit_request_parameters: true
  fallback_provider: null
  raw_response_storage: "ephemeral_hash_then_discard"
  normalized_storage: "user_local_content_addressed_if_permitted"
  cache_storage: "outside_git_only"
  adj_close_as_model_input: false
  action_columns_use: "audit_metadata_and_warnings_only"
  representation: "raw_ohlcv"
  return_target: "raw_five_session_close_to_close_log_return"
  corporate_action_policy: >-
    No corporate-action engine in v0; raw bars are used as delivered and
    dividend effects are recorded as a known return-target limitation.
  limitations:
    - "YFINANCE_IS_NOT_AN_OFFICIAL_YAHOO_INTEGRATION"
    - "AVAILABILITY_AND_RESPONSE_BEHAVIOR_MAY_CHANGE"
    - "NOT_AN_INSTITUTIONAL_POINT_IN_TIME_SOURCE"
    - "RAW_DATA_MUST_NOT_BE_COMMITTED_OR_REDISTRIBUTED"
    - "PROVIDER_INDEPENDENCE_NOT_ESTABLISHED"
  optional_verification_provider:
    provider: "alpaca"
    phase_2_enabled: false
    credentials: "user_environment_only"
    role: "later_independent_verification"
  cross_provider_verification:
    phase_2_enabled: false
    required_before_serious_publication: true
    representative_sample_required: true
    compare:
      - "ROW_LEVEL_DIFFERENCES"
      - "RETURN_DIFFERENCES"
      - "FORECAST_DIFFERENCES"
      - "DIAGNOSTIC_DIFFERENCES"
      - "SENTINEL_CONCLUSION_CHANGES"

forecast_provider:
  contract_version: "sentinel-forecast-provider-v0"
  selected_mode: "temporary_local_huggingface_cache_outside_git"
  selection_reason: >-
    The official Kronos-mini model page reports no deployed Hugging Face
    Inference Provider; a permanent custom endpoint is disproportionate before
    signal discovery.
  official_source:
    repository: "https://github.com/shiyu-coder/Kronos"
    revision: "67b630e67f6a18c9e9be918d9b4337c960db1e9a"
  model:
    identifier: "NeoQuasar/Kronos-mini"
    revision: "f4e68697d9d5aed55cef5c96aabc3376bcad9f81"
    reported_parameters: 4108192
    reported_storage_bytes: 16440776
  tokenizer:
    identifier: "NeoQuasar/Kronos-Tokenizer-2k"
    revision: "26966d0035065a0cae0ebad7af8ece35bc1fb51c"
    reported_parameters: 3958259
    reported_storage_bytes: 15842376
  cache_must_be_outside_git: true
  commit_weights: false
  trust_remote_code: false
  file_hashes: "resolve_and_record_before_first_real_forecast"
  stop_conditions:
    - "NO_REAL_KRONOS_OUTPUT"
    - "UNREASONABLE_RUNTIME_OR_MEMORY"
    - "UNCONTROLLED_SAMPLING_SEED"
    - "UNSAFE_MODEL_LOADING_REQUIRED"

ensemble:
  context_lengths: [128, 256, 512]
  sampling_seeds: [1729, 2027, 7919]
  temperature: 1.0
  top_p: 0.9
  generated_paths_per_request: 1
  requests_per_cutoff: 9
  sensitivity_configuration: null
  primary_path_aggregation: "arithmetic_mean_of_three_512_context_close_paths"
  primary_return_aggregation: >-
    log(final_averaged_512_context_predicted_close /
    final_observed_raw_close_at_cutoff)
  canonical_forecast:
    context_length: 512
    sampling_seeds: [1729, 2027, 7919]
    path_count: 3
    close_path_aggregation: "timestamp_by_timestamp_arithmetic_mean"
    individual_paths_preserved: true
  stress_test_paths:
    context_lengths: [128, 256]
    sampling_seeds: [1729, 2027, 7919]
    contribute_to_canonical_forecast: false
  reproducibility_probe:
    requests:
      - {context_length: 512, sampling_seed: 1729, label: "A"}
      - {context_length: 512, sampling_seed: 1729, label: "B"}
      - {context_length: 512, sampling_seed: 2027, label: "C"}
    reset_rngs_before_each_request:
      - "python"
      - "numpy"
      - "torch_cpu"
      - "torch_accelerators_if_applicable"
    canonicalize_and_hash_each_output: true
    expected_identical_pairs: [["A", "B"]]
    expected_ordinary_difference_pairs: [["A", "C"]]
    mismatch_policy: "preserve_outputs_and_mark_exact_replay_unsupported"

baseline:
  identifier: "last-value-zero-return"
  path_rule: "repeat_cutoff_raw_close_for_five_sessions"
  predicted_return: 0.0

phase_2_origin:
  asset: "SPY"
  forecast_cutoff: "2024-07-05"
  forecast_sessions:
    - "2024-07-08"
    - "2024-07-09"
    - "2024-07-10"
    - "2024-07-11"
    - "2024-07-12"
  calendar: "XNYS"
  input_fields: ["open", "high", "low", "close", "volume"]
  amount_field: "forbidden"
  action_emission: "forbidden_before_phase_3_risk_model_freeze"
  report_label: "DEVELOPMENT PROOF — NOT EMPIRICAL EVIDENCE"

analogue_policy:
  context_returns: 20
  nearest_count: 10
  minimum_support: 10
  normalization: "per_candidate_window_z_score_using_only_window_values"
  candidate_outcome_must_resolve_before_cutoff: true
  overlap_policy: >-
    Greedily select by ascending distance and exclude candidates whose input or
    five-session outcome sessions overlap a previously selected candidate.
  insufficient_support_status: "not_computable"

phase_2_diagnostic_availability:
  RECENT_MODEL_ERROR:
    status: "not_computable"
    value: null
    reason: "NO_PRIOR_RESOLVED_FORECASTS"
  UNCERTAINTY_MISCALIBRATION:
    status: "not_computable"
    value: null
    reason: "NO_PRIOR_CALIBRATION_SAMPLE"

diagnostics:
  - "DIRECTIONAL_AGREEMENT"
  - "RETURN_DISPERSION"
  - "PATH_DISPERSION"
  - "CONTEXT_DIRECTION_AGREEMENT"
  - "CONTEXT_RETURN_SPREAD"
  - "BASELINE_DISAGREEMENT"
  - "RECENT_VOLATILITY"
  - "VOLATILITY_CHANGE"
  - "TREND_STRENGTH"
  - "GAP_OR_OUTLIER_SCORE"
  - "HISTORICAL_ANALOGUE_DISTANCE"
  - "ANALOGUE_OUTCOME_DISPERSION"
  - "RECENT_MODEL_ERROR"
  - "HORIZON_PATH_DIVERGENCE"
  - "INVALID_PATH_FRACTION"
  - "INVALID_CANDLE_FRACTION"
  - "TOTAL_CONSTRAINT_VIOLATIONS"
  - "MAX_CONSTRAINT_VIOLATION_SEVERITY"
  - "MEAN_CONSTRAINT_VIOLATION_SEVERITY"
  - "EARLIEST_INVALID_HORIZON_STEP"
  - "HIGH_LOW_INVERSION_COUNT"
  - "HIGH_BELOW_BODY_COUNT"
  - "LOW_ABOVE_BODY_COUNT"
  - "NONFINITE_OUTPUT_COUNT"
  - "NONPOSITIVE_PRICE_COUNT"
diagnostic_definition_source: "docs/SENTINEL_METHODOLOGY.md"
expected_error_correlation_signs:
  DIRECTIONAL_AGREEMENT: "negative"
  RETURN_DISPERSION: "positive"
  PATH_DISPERSION: "positive"
  CONTEXT_DIRECTION_AGREEMENT: "negative"
  CONTEXT_RETURN_SPREAD: "positive"
  BASELINE_DISAGREEMENT: "positive"
  RECENT_VOLATILITY: "positive"
  VOLATILITY_CHANGE: "positive"
  TREND_STRENGTH: null
  GAP_OR_OUTLIER_SCORE: "positive"
  HISTORICAL_ANALOGUE_DISTANCE: "positive"
  ANALOGUE_OUTCOME_DISPERSION: "positive"
  RECENT_MODEL_ERROR: "positive"
  HORIZON_PATH_DIVERGENCE: "positive"
  INVALID_PATH_FRACTION: "positive"
  INVALID_CANDLE_FRACTION: "positive"
  TOTAL_CONSTRAINT_VIOLATIONS: "positive"
  MAX_CONSTRAINT_VIOLATION_SEVERITY: "positive"
  MEAN_CONSTRAINT_VIOLATION_SEVERITY: "positive"
  EARLIEST_INVALID_HORIZON_STEP: "negative"
  HIGH_LOW_INVERSION_COUNT: "positive"
  HIGH_BELOW_BODY_COUNT: "positive"
  LOW_ABOVE_BODY_COUNT: "positive"
  NONFINITE_OUTPUT_COUNT: null
  NONPOSITIVE_PRICE_COUNT: null

structural_validity:
  status: "locked_before_development_sample_and_holdout"
  discovery_phase: "phase_2_development_origin"
  audit_conclusion: "OFFICIAL_RAW_PATH_STRUCTURAL_INVALIDITY_CONFIRMED"
  report: "docs/SENTINEL_STRUCTURAL_VALIDITY.md"
  price_severity_denominator: "final_observed_raw_close_at_cutoff"
  validate:
    - "FINITE_OHLC"
    - "POSITIVE_OHLC"
    - "HIGH_AT_LEAST_OPEN_CLOSE_LOW"
    - "LOW_AT_MOST_OPEN_CLOSE_HIGH"
    - "NONNEGATIVE_PREDICTED_VOLUME"
    - "EXACT_EXPECTED_TIMESTAMPS"
    - "NO_DUPLICATE_TIMESTAMPS"
    - "EXACT_HORIZON_LENGTH"
  raw_output_policy: "preserve_without_silent_mutation"
  projection_policy: "CONSTRAINT_PROJECTION_V0_optional_separate_artifact_only"
  gate:
    nonfinite_nonpositive_or_alignment_failure: "persist_provider_failure_and_block_use"
    finite_ohlc_ordering_failure: "mark_structurally_invalid_and_retain_for_development_evaluation"
    silent_baseline_substitution: false
    silent_projection_substitution: false
  statistical_expectation: >-
    Larger invalid fractions, violation counts, and severity are expected to
    associate with larger future Kronos error; an earlier first invalid step is
    expected to associate with larger error. Nonfinite and nonpositive counts
    are runtime gates, not eligible predictors, because such forecasts may not
    have a defensible scoreable return.

targets:
  continuous_primary: "absolute_raw_five_session_close_to_close_log_return_error"
  realized_return_definition: >-
    log(raw_close_on_2024-07-12 / raw_close_on_2024-07-05)
  failure_label:
    rule: "error_greater_than_or_equal_to_pooled_development_quantile"
    quantile: 0.75
    threshold_source: "development_only"
  deployability_label: "kronos_absolute_error_strictly_greater_than_baseline"
  secondary:
    - "DIRECTION_CORRECT"
    - "REALIZED_RETURN_MAGNITUDE"
    - "MEAN_RAW_CLOSE_PATH_ABSOLUTE_ERROR"
  trading_profitability_used: false

risk_model:
  primary:
    kind: "l2_logistic_regression"
    c_grid: [0.01, 0.1, 1.0, 10.0]
    selection_metric: "mean_expanding_split_log_loss"
  continuous_secondary:
    kind: "ridge_regression"
    alpha_grid: [0.1, 1.0, 10.0, 100.0]
    selection_metric: "mean_expanding_split_mae"
  folds:
    kind: "expanding_time_series_split"
    splits: 3
    gap_weeks: 1
    group_assets_by_cutoff: true
  include_asset_identity: false
  missingness:
    drop_if_development_missing_fraction_above: 0.20
    imputation: "development_median"
    add_missing_indicator: true
  redundancy:
    absolute_spearman_threshold: 0.95
    keep_rule: "more_directly_interpretable_diagnostic"
  random_seed: 314159

action_policy:
  threshold_source: "development_risk_distribution"
  use:
    maximum_risk_quantile: 0.50
    output: "kronos_mean_512_context_forecast"
  blend:
    minimum_risk_quantile_exclusive: 0.50
    maximum_risk_quantile: 0.80
    kronos_weight: 0.50
    baseline_weight: 0.50
  abstain:
    minimum_risk_quantile_exclusive: 0.80
    output: null

evaluation:
  coverage_levels: [1.00, 0.90, 0.80, 0.70, 0.50]
  required_outputs:
    - "SPEARMAN_RISK_ERROR"
    - "ERROR_BY_RISK_QUINTILE"
    - "RISK_COVERAGE_CURVE"
    - "ACCEPTED_FORECAST_MAE"
    - "DIRECTIONAL_ACCURACY_BY_COVERAGE"
    - "BASELINE_COMPARISON"
    - "FAILURE_PROBABILITY_CALIBRATION"
    - "FAILURE_CONFUSION_MATRIX"
    - "PER_ASSET_AND_POOLED_RESULTS"
    - "QUARTERLY_STABILITY"
    - "DIAGNOSTIC_CONTRIBUTIONS"
    - "RUNTIME_COST_AND_FAILURE_SUMMARY"
  holdout_modification_allowed: false

continuation:
  signal_criteria:
    s1_minimum_pooled_spearman: 0.20
    s2_maximum_mae_ratio_at_70_percent_coverage: 0.90
    s3_minimum_nondecreasing_adjacent_quintile_steps: 3
    s3_highest_quintile_must_exceed_lowest: true
    s4_each_asset_spearman_must_be_positive: true
    s4_each_asset_70_percent_mae_must_not_exceed_full_mae: true
    s5_minimum_supported_diagnostic_absolute_spearman: 0.15
  feasibility_criterion:
    minimum_real_request_success_rate: 0.95
    maximum_median_ensemble_latency_seconds: 600
    maximum_cache_bytes: 2147483648
    maximum_hosted_equivalent_cost_usd_per_cutoff: 0.50
  decision_rule_source: "docs/SENTINEL_METHODOLOGY.md"

reason_taxonomy: "docs/SENTINEL_FAILURE_TAXONOMY.md"

artifact_policy:
  reuse_openalpha_research_core: true
  content_address:
    - "FORECAST_REQUEST"
    - "FORECAST_RESPONSE"
    - "DIAGNOSTIC_VECTOR"
    - "SENTINEL_DECISION"
    - "RESOLVED_OUTCOME"
    - "EVALUATION_REPORT"
  append_lifecycle:
    - "FORECAST_CREATED"
    - "DIAGNOSTICS_COMPUTED"
    - "SENTINEL_DECIDED"
    - "OUTCOME_RESOLVED"
    - "POSTMORTEM_CLASSIFIED"
  raw_market_data_in_git: false
  model_weights_in_git: false

non_goals:
  - "PUBLIC_SDK_OR_API"
  - "FRONTEND"
  - "DATABASE"
  - "TRADING_OR_PORTFOLIO_SIMULATION"
  - "NEWS_FILINGS_OR_MACRO_EVENTS"
  - "MODEL_FINETUNING"
  - "COMPLEX_FORECAST_REPAIR"
  - "UNIVERSAL_PROTOCOL_SCHEMA"
  - "ADDITIONAL_ASSETS_OR_HORIZONS"
