[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openalpha-experiment-spec"
version = "0.1.0"
description = "Immutable, versioned OpenAlpha experiment contracts"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openalpha_experiment_spec"]
