[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openalpha-bridge"
version = "0.1.0"
description = "Constraint-preserving mathematical decoder contract for OpenAlpha Bridge"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.5,<3",
  "openalpha-sentinel",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
# Base execution: provider retrieval only. No Torch, no model assets.
bridge-core = ["yfinance==1.5.2"]
# Pinned Kronos asset resolution and hash verification.
# einops and tqdm are runtime imports of the pinned official Kronos source,
# so they are declared here to give the lockfile authority over their versions.
bridge-kronos = [
  "huggingface-hub>=0.34,<1",
  "safetensors>=0.4,<1",
  "einops>=0.8,<1",
  "tqdm>=4.66,<5",
  "pandas>=2.2,<4",
]
# Stage C training. Pulls Torch; never required by the base test suite.
bridge-training = ["torch>=2.5,<3"]
# Control plane and S3-compatible artifact store (Cloudflare R2 by default).
bridge-cloud = ["boto3>=1.35,<2", "fastapi>=0.115,<1"]
# Managed compute backend.
bridge-modal = ["modal>=0.64,<2"]
# Convenience aggregate for the managed cloud worker.
bridge-gpu = [
  "openalpha-bridge[bridge-core]",
  "openalpha-bridge[bridge-kronos]",
  "openalpha-bridge[bridge-training]",
  "openalpha-bridge[bridge-cloud]",
]

[project.scripts]
openalpha-bridge-phase2 = "openalpha_bridge.phase2.cli:main"

[tool.uv.sources]
openalpha-sentinel = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/openalpha_bridge"]
